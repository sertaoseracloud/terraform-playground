name: Testes

# Os portões de qualidade. Rodam em todo PR para develop ou main e no começo de cada
# deploy (deploy.yml chama este arquivo). Os nomes dos jobs bloqueantes (qualidade, e2e,
# lighthouse) são os checks obrigatórios dos rulesets de main e develop.
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo para a página de novidades
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - name: Arquivos comuns aos quatro playgrounds (veja comuns.json)
        run: npm run comuns
      - name: Testes com cobertura (o limite está no vitest.config.js)
        run: npm run test:cobertura
      - name: npm audit (dependências com falha alta ou crítica)
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage/

  e2e:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Segredo aleatório, gerado aqui e descartado: os testes não dependem do de produção.
      - name: Build
        run: CERTIFICADO_SEGREDO=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))") npm run build
      - name: E2E no Chromium (bloqueia)
        run: npx playwright test --project=chromium
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  e2e-outros:
    needs: qualidade
    runs-on: ubuntu-latest
    continue-on-error: true # informativo: Firefox, WebKit e celular viram itens, não bloqueiam
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Build
        run: CERTIFICADO_SEGREDO=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))") npm run build
      - name: E2E no Firefox, WebKit e celular (informativo)
        run: npx playwright test --project=firefox --project=webkit --project=mobile
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-outros
          path: playwright-report/

  lighthouse:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: CERTIFICADO_SEGREDO=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))") npm run build
      - name: Lighthouse CI (SEO e acessibilidade >= 0,9; CLS <= 0,1)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30
