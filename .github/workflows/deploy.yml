name: Deploy

# Publica o site no GitHub Pages a partir do main, a cada push nele (ou manualmente).
# É o único workflow do repositório: testes, homologação, smoke test, tag/release e os
# PRs automáticos rodam localmente (npm run lint, npm test, npm run test:e2e).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, e nenhuma é cancelada no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # histórico completo para a página de novidades
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Palavra secreta do selo dos certificados (Settings > Secrets > Actions).
          CERTIFICADO_SEGREDO: ${{ secrets.CERTIFICADO_SEGREDO }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@v5
